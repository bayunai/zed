name: Build Zed Chinese macOS

on:
  workflow_dispatch:
  push:
    branches:
      - zed-localized-20260510
    tags:
      - "zed-chinese-v*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  ZED_BUNDLE: "true"

jobs:
  build-macos:
    name: Build macOS arm64 app
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Prepare version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          zed_version="$(script/get-crate-version zed)"
          build_date="$(date -u +%Y%m%d)"
          bundle_version="${build_date}.${GITHUB_RUN_NUMBER}"
          chinese_version="${zed_version}-cn.${bundle_version}"

          {
            echo "zed_version=${zed_version}"
            echo "bundle_version=${bundle_version}"
            echo "chinese_version=${chinese_version}"
          } >> "$GITHUB_OUTPUT"

          echo "ZED_RELEASE_CHANNEL=dev" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${zed_version}" >> "$GITHUB_ENV"

      - name: Build Zed Chinese
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --locked \
            --target aarch64-apple-darwin \
            --package zed \
            --package cli

      - name: Create app bundle
        shell: bash
        env:
          ZED_VERSION: ${{ steps.version.outputs.zed_version }}
          BUNDLE_VERSION: ${{ steps.version.outputs.bundle_version }}
          CHINESE_VERSION: ${{ steps.version.outputs.chinese_version }}
        run: |
          set -euo pipefail

          app_path="dist/Zed-Chinese.app"
          contents_path="${app_path}/Contents"
          macos_path="${contents_path}/MacOS"
          resources_path="${contents_path}/Resources"

          rm -rf dist
          mkdir -p "${macos_path}" "${resources_path}"

          cp "target/aarch64-apple-darwin/release/zed" "${macos_path}/Zed"
          cp "target/aarch64-apple-darwin/release/cli" "${macos_path}/cli"
          chmod +x "${macos_path}/Zed" "${macos_path}/cli"

          cp "crates/zed/resources/Document.icns" "${resources_path}/Document.icns"

          icon_source="crates/zed/resources/app-icon@2x.png"
          iconset_path="${resources_path}/AppIcon.iconset"
          mkdir -p "${iconset_path}"
          for size in 16 32 128 256 512; do
            sips -z "${size}" "${size}" "${icon_source}" --out "${iconset_path}/icon_${size}x${size}.png" >/dev/null
            double_size=$((size * 2))
            sips -z "${double_size}" "${double_size}" "${icon_source}" --out "${iconset_path}/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "${iconset_path}" -o "${resources_path}/AppIcon.icns"
          rm -rf "${iconset_path}"

          cat > "${contents_path}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>Zed Chinese</string>
            <key>CFBundleExecutable</key>
            <string>Zed</string>
            <key>CFBundleGetInfoString</key>
            <string>Zed Chinese ${CHINESE_VERSION}</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeIconFile</key>
                <string>Document</string>
                <key>CFBundleTypeRole</key>
                <string>Editor</string>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.folder</string>
                  <string>public.data</string>
                  <string>public.plain-text</string>
                  <string>public.text</string>
                  <string>public.utf8-plain-text</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeIconFile</key>
                <string>Document</string>
                <key>CFBundleTypeName</key>
                <string>Zed Text Document</string>
                <key>CFBundleTypeRole</key>
                <string>Editor</string>
                <key>CFBundleTypeOSTypes</key>
                <array>
                  <string>****</string>
                </array>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>Gemfile</string>
                  <string>c</string>
                  <string>c++</string>
                  <string>cc</string>
                  <string>cpp</string>
                  <string>css</string>
                  <string>erb</string>
                  <string>ex</string>
                  <string>exs</string>
                  <string>go</string>
                  <string>h</string>
                  <string>h++</string>
                  <string>hh</string>
                  <string>hpp</string>
                  <string>html</string>
                  <string>js</string>
                  <string>json</string>
                  <string>jsx</string>
                  <string>md</string>
                  <string>py</string>
                  <string>rb</string>
                  <string>rkt</string>
                  <string>rs</string>
                  <string>scm</string>
                  <string>toml</string>
                  <string>ts</string>
                  <string>tsx</string>
                  <string>txt</string>
                  <string>yaml</string>
                  <string>yml</string>
                </array>
              </dict>
            </array>
            <key>CFBundleIdentifier</key>
            <string>dev.zed.Zed-Chinese</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Zed Chinese</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${ZED_VERSION}</string>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>CFBundleURLName</key>
                <string>Zed Chinese</string>
                <key>CFBundleURLSchemes</key>
                <array>
                  <string>zed-chinese</string>
                </array>
              </dict>
            </array>
            <key>CFBundleVersion</key>
            <string>${BUNDLE_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key>
            <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "${contents_path}/Info.plist"
          codesign --force --deep --sign - "${app_path}"
          codesign --verify --deep --strict "${app_path}"

          echo "${CHINESE_VERSION}" > "dist/VERSION.txt"

      - name: Package artifact
        shell: bash
        env:
          CHINESE_VERSION: ${{ steps.version.outputs.chinese_version }}
        run: |
          set -euo pipefail

          ditto -c -k --keepParent "dist/Zed-Chinese.app" "dist/Zed-Chinese-${CHINESE_VERSION}-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zed-Chinese-${{ steps.version.outputs.chinese_version }}-macos-arm64
          path: |
            dist/Zed-Chinese-${{ steps.version.outputs.chinese_version }}-macos-arm64.zip
            dist/VERSION.txt
